on:
  - push

name: Build & publish

env:
  USERNAME: ${{ github.actor }}
  TOKEN: ${{ github.token }}
  AA_USERNAME: ${{ vars.AA_USERNAME }}
  AA_PASSWORD: ${{ secrets.AA_PASSWORD }}

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.runs-on }}
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform: [jvm, js, wasmJs, linuxX64]
        runs-on: [ubuntu-26.04]
        include:
          #- platform: linuxArm64
          #  runs-on: ubuntu-26.04-arm
          - platform: macosArm64
            runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup gradle caching
        uses: burrunan/gradle-cache-action@v3
        with:
          read-only: ${{ github.ref != 'refs/heads/master' }}
          remote-build-cache-proxy-enabled: false
      - name: Cache konan
        uses: actions/cache@v5
        with:
          key: 'konan'
          path: '/home/runner/.konan'
      - name: Accept Develocity Terms of Use
        run: |
          cat >> ./settings.gradle.kts <<EOF
          develocity {
              buildScan {
                  termsOfUseUrl.set("https://gradle.com/help/legal-terms-of-use")
                  termsOfUseAgree.set("yes")
              }
          }
          EOF
      - name: Setup compiler plugin
        run: ./gradlew :serenity-compiler-plugin:publishJavaPublicationToLocalDirectoryRepository
      - name: Run tests
        run: ./gradlew ${{ matrix.platform }}Test

  test-compiler-plugin:
    name: Test compiler plugin
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup gradle caching
        uses: burrunan/gradle-cache-action@v3
        with:
          read-only: ${{ github.ref != 'refs/heads/master' }}
          remote-build-cache-proxy-enabled: false
      - name: Accept Develocity Terms of Use
        run: |
          cat >> ./settings.gradle.kts <<EOF
          develocity {
              buildScan {
                  termsOfUseUrl.set("https://gradle.com/help/legal-terms-of-use")
                  termsOfUseAgree.set("yes")
              }
          }
          EOF
      - name: Setup compiler plugin
        run: ./gradlew :serenity-compiler-plugin:publishJavaPublicationToLocalDirectoryRepository
      - name: Run tests
        run: ./gradlew :serenity-compiler-plugin:test
  test-gradle:
    name: Test gradle plugin
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup gradle caching
        uses: burrunan/gradle-cache-action@v3
        with:
          read-only: ${{ github.ref != 'refs/heads/master' }}
          remote-build-cache-proxy-enabled: false
      - name: Accept Develocity Terms of Use
        run: |
          cat >> ./settings.gradle.kts <<EOF
          develocity {
              buildScan {
                  termsOfUseUrl.set("https://gradle.com/help/legal-terms-of-use")
                  termsOfUseAgree.set("yes")
              }
          }
          EOF
      - name: Run tests
        run: ./gradlew :gradle-plugin:test :gradle-plugin:serenity-sass-gradle-plugin:test

  publish-nexus:
    if: github.ref_name == 'master' && github.repository == 'der-fruhling/serenity'
    name: Build & Publish to Nexus
    runs-on: ubuntu-latest
    needs: [test, test-gradle, test-compiler-plugin]
    environment: production
    permissions:
      packages: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup gradle caching
      uses: burrunan/gradle-cache-action@v3
      with:
        read-only: ${{ github.ref != 'refs/heads/master' }}
        remote-build-cache-proxy-enabled: false
    - name: Cache konan
      uses: actions/cache@v5
      with:
        key: 'konan'
        path: '/home/runner/.konan'
    - name: Accept Develocity Terms of Use
      run: |
        cat >> ./settings.gradle.kts <<EOF
        develocity {
            buildScan {
                termsOfUseUrl.set("https://gradle.com/help/legal-terms-of-use")
                termsOfUseAgree.set("yes")
            }
        }
        EOF
    - name: Setup compiler plugin
      run: ./gradlew :serenity-compiler-plugin:publishJavaPublicationToLocalDirectoryRepository
    - name: Build
      run: ./gradlew assemble :gradle-plugin:assemble :gradle-plugin:serenity-sass-gradle-plugin:assemble --exclude :test-app:assemble
    - name: Publish
      run: ./gradlew publishAllPublicationsToNexusRepository :gradle-plugin:publishAllPublicationsToNexusRepository :gradle-plugin:serenity-sass-gradle-plugin:publishAllPublicationsToNexusRepository

  publish-github:
    if: github.ref_name == 'master' && github.repository == 'der-fruhling/serenity'
    name: Build & Publish to Github Packages
    runs-on: ubuntu-latest
    needs: [test, test-gradle, test-compiler-plugin]
    environment: production
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup gradle caching
        uses: burrunan/gradle-cache-action@v3
        with:
          read-only: ${{ github.ref != 'refs/heads/master' }}
          remote-build-cache-proxy-enabled: false
      - name: Cache konan
        uses: actions/cache@v5
        with:
          key: 'konan'
          path: '/home/runner/.konan'
      - name: Restore dir
        uses: actions/cache/restore@v5
        with:
          key: 'saved-build'
          path: |
            build
            modules
            gradle-plugin
            buildSrc
      - name: Accept Develocity Terms of Use
        run: |
          cat >> ./settings.gradle.kts <<EOF
          develocity {
              buildScan {
                  termsOfUseUrl.set("https://gradle.com/help/legal-terms-of-use")
                  termsOfUseAgree.set("yes")
              }
          }
          EOF
      - name: Setup compiler plugin
        run: ./gradlew :serenity-compiler-plugin:publishJavaPublicationToLocalDirectoryRepository
      - name: Build
        run: ./gradlew assemble :gradle-plugin:assemble :gradle-plugin:serenity-sass-gradle-plugin:assemble --exclude :test-app:assemble
      - name: Publish
        run: ./gradlew publishAllPublicationsToGithubPackagesRepository :gradle-plugin:publishAllPublicationsToGithubPackagesRepository :gradle-plugin:serenity-sass-gradle-plugin:publishAllPublicationsToGithubPackagesRepository
