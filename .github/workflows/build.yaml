on:
  - push

name: Build & publish

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    permissions:
      packages: read
    env:
      USERNAME: ${{ github.actor }}
      TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup gradle caching
        uses: burrunan/gradle-cache-action@v3
        with:
          read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Accept Develocity Terms of Use
        run: |
          cat >> ./settings.gradle.kts <<EOF
          develocity {
              buildScan {
                  termsOfUseUrl.set("https://gradle.com/help/legal-terms-of-use")
                  termsOfUseAgree.set("yes")
              }
          }
          EOF
      - name: Setup compiler plugin
        run: ./gradlew :serenity-compiler-plugin:publishJavaPublicationToLocalDirectoryRepository
      - name: Build
        run: ./gradlew assemble :gradle-plugin:assemble --exclude-task :test-app:assemble
      - name: Save dir
        uses: actions/cache/save@v5
        if: github.ref_name == 'master' && github.repository == 'der-fruhling/serenity'
        with:
          key: 'saved-build'
          path: |
            build
            modules
            gradle-plugin
            buildSrc

  publish:
    if: github.ref_name == 'master' && github.repository == 'der-fruhling/serenity'
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      packages: write
    env:
      USERNAME: ${{ github.actor }}
      TOKEN: ${{ github.token }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup gradle caching
      uses: burrunan/gradle-cache-action@v3
      with:
        read-only: ${{ github.ref != 'refs/heads/master' }}
    - name: Accept Develocity Terms of Use
      run: |
        cat >> ./settings.gradle.kts <<EOF
        develocity {
            buildScan {
                termsOfUseUrl.set("https://gradle.com/help/legal-terms-of-use")
                termsOfUseAgree.set("yes")
            }
        }
        EOF
    - name: Setup compiler plugin
      run: ./gradlew :serenity-compiler-plugin:publishJavaPublicationToLocalDirectoryRepository
    - name: Publish
      run: ./gradlew publishAllPublicationsToGithubPackagesRepository :gradle-plugin:publishAllPublicationsToGithubPackagesRepository
